services:
  - type: web
    name: docshield-ai
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: "uploads"
      - key: PYTHON_VERSION
        value: "3.11.9"
